[package]
name = "widget"
version = "0.1.0"
description = "Gadget Generator, the executable"
edition.workspace = true
license.workspace = true
publish.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
engine = { path = "../engine" }
formats = { path = "../formats" }
platform = { path = "../platform" }
web-time = "1.1"
# `wasmbind`: the browser's clock on wasm, where `std::time` panics.
chrono = { version = "0.4", default-features = false, features = ["clock", "wasmbind"] }
# The system's (or the browser's) language, for the port's own packs
# without a CD.
sys-locale = { version = "0.3", features = ["js"] }

# The file dialog that asks for the CD when it isn't given (`pick`):
# natively only, the browser's page asks for it itself.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = "0.18"

# Whether rfd has a dialog to show (`pick::has_dialog`): the portal's
# FileChooser on the session bus.
[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "dragonfly", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
zbus = { version = "6", default-features = false, features = ["default-rt"] }

# The browser build (docs/web.md): the page's storage and its query.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
# The version of the wasm-bindgen CLI that builds the page
# (tools/build-web.sh): the two must match exactly.
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Blob", "EventTarget", "Location", "Window"] }

# The Windows executable's icon (build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[lints]
workspace = true

# The Linux packages (cargo-deb, cargo-generate-rpm; the CI's linux job):
# the program, its desktop entry and icon, the licence and the README.
[package.metadata.deb]
name = "gadget-generator"
maintainer = "Doridian <git@doridian.net>"
copyright = "Doridian and the Gadget Generator contributors"
license-file = ["../../LICENSE", "0"]
section = "games"
priority = "optional"
extended-description = """\
A decompilation and native port of Widget Workshop: A Mad Scientist's \
Laboratory (Maxis, 1995), with its own graphics, sounds and data, so it \
runs without the original CD; with the CD it can use the original's \
instead."""
depends = "$auto"
assets = [
    ["target/release/widget", "usr/bin/", "755"],
    ["res/gadget-generator.desktop", "usr/share/applications/", "644"],
    ["res/icon.png", "usr/share/icons/hicolor/512x512/apps/gadget-generator.png", "644"],
    ["../../README.md", "usr/share/doc/gadget-generator/README.md", "644"],
]

[package.metadata.generate-rpm]
name = "gadget-generator"
summary = "A decompilation and native port of Maxis' Widget Workshop"
url = "https://doridian.github.io/GadgetGenerator/"
assets = [
    { source = "target/release/widget", dest = "/usr/bin/widget", mode = "755" },
    { source = "res/gadget-generator.desktop", dest = "/usr/share/applications/gadget-generator.desktop", mode = "644" },
    { source = "res/icon.png", dest = "/usr/share/icons/hicolor/512x512/apps/gadget-generator.png", mode = "644" },
    { source = "../../README.md", dest = "/usr/share/doc/gadget-generator/README.md", mode = "644", doc = true },
    { source = "../../LICENSE", dest = "/usr/share/licenses/gadget-generator/LICENSE", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
alsa-lib = "*"
